version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sitepilot-postgres
    environment:
      POSTGRES_USER:     sitepilot
      POSTGRES_PASSWORD: sitepilot
      POSTGRES_DB:       sitepilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitepilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sitepilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: sitepilot-api
    environment:
      APP_ENV:       development
      DATABASE_URL:  postgresql://sitepilot:sitepilot@postgres:5432/sitepilot
      REDIS_URL:     redis://redis:6379/0
      SECRET_KEY:    dev-secret-key-change-in-prod
      CORS_ORIGINS:  http://localhost:3000
      REPOS_BASE_PATH: /data/repos
    volumes:
      - ./backend:/app
      - repos_data:/data/repos
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: sitepilot-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: ""
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # ── Local Docker Registry ────────────────────────────────────────────────────
  registry:
    image: registry:2
    container_name: sitepilot-registry
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry

volumes:
  postgres_data:
  repos_data:
  registry_data:
