---
# site.yml — run this to configure the entire infrastructure from scratch
# Usage: ansible-playbook playbooks/site.yml

- name: Common setup on all VMs
  hosts: all
  become: true
  tasks:
    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common packages
      apt:
        name:
          - curl
          - wget
          - git
          - python3
          - python3-pip
          - unzip
          - htop
          - net-tools
        state: present

    - name: Install Docker
      block:
        - name: Add Docker GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker repository
          apt_repository:
            repo: >
              deb [arch=amd64]
              https://download.docker.com/linux/ubuntu
              {{ ansible_distribution_release }} stable
            state: present

        - name: Install Docker CE
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-compose-plugin
            state: present

        - name: Start and enable Docker
          service:
            name: docker
            state: started
            enabled: true

        - name: Add ubuntu user to docker group
          user:
            name: ubuntu
            groups: docker
            append: true

- name: Configure CI/CD server
  hosts: ci_servers
  become: true
  import_playbook: setup-ci.yml

- name: Configure Kubernetes node
  hosts: k8s_nodes
  become: true
  import_playbook: setup-k8s.yml

- name: Configure tools server
  hosts: tools_servers
  become: true
  import_playbook: setup-tools.yml
