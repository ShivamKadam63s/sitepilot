---
- name: Setup Kubernetes node (Minikube)
  hosts: k8s_nodes
  become: true

  vars:
    kubectl_version: "v1.29.2"
    minikube_version: "v1.32.0"
    k8s_user: ubuntu

  tasks:

    # ── kubectl ───────────────────────────────────────────────────────────────
    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Verify kubectl
      command: kubectl version --client
      changed_when: false
      register: kubectl_ver

    - name: Print kubectl version
      debug:
        msg: "{{ kubectl_ver.stdout }}"

    # ── Minikube ──────────────────────────────────────────────────────────────
    - name: Download Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: "0755"

    - name: Start Minikube as ubuntu user
      become_user: "{{ k8s_user }}"
      command: >
        minikube start
        --driver=docker
        --cpus=4
        --memory=6144
        --disk-size=25g
        --insecure-registry="{{ registry_url }}"
      args:
        creates: /home/{{ k8s_user }}/.minikube/profiles/minikube/config.json
      environment:
        HOME: "/home/{{ k8s_user }}"
        USER: "{{ k8s_user }}"

    # ── Enable addons ─────────────────────────────────────────────────────────
    - name: Enable Minikube addons
      become_user: "{{ k8s_user }}"
      command: "minikube addons enable {{ item }}"
      loop:
        - ingress
        - metrics-server
        - dashboard
      environment:
        HOME: "/home/{{ k8s_user }}"
      changed_when: false

    # ── Namespaces ────────────────────────────────────────────────────────────
    - name: Create platform namespace
      become_user: "{{ k8s_user }}"
      command: kubectl create namespace sitepilot-platform --dry-run=client -o yaml | kubectl apply -f -
      environment:
        HOME: "/home/{{ k8s_user }}"
      changed_when: false

    - name: Create tenants namespace
      become_user: "{{ k8s_user }}"
      command: kubectl create namespace tenants --dry-run=client -o yaml | kubectl apply -f -
      environment:
        HOME: "/home/{{ k8s_user }}"
      changed_when: false

    # ── Helm ──────────────────────────────────────────────────────────────────
    - name: Install Helm
      block:
        - name: Download Helm install script
          get_url:
            url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
            dest: /tmp/get-helm.sh
            mode: "0755"

        - name: Run Helm install script
          command: /tmp/get-helm.sh
          args:
            creates: /usr/local/bin/helm

    # ── Print access info ─────────────────────────────────────────────────────
    - name: Get Minikube IP
      become_user: "{{ k8s_user }}"
      command: minikube ip
      register: minikube_ip
      changed_when: false
      environment:
        HOME: "/home/{{ k8s_user }}"

    - name: Print Minikube info
      debug:
        msg:
          - "Minikube IP: {{ minikube_ip.stdout }}"
          - "Dashboard:   run 'minikube dashboard' on the VM"
          - "Sites will be at: {slug}.{{ minikube_ip.stdout }}.nip.io"
