apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sitepilot-ingress
  namespace: sitepilot-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    # Frontend — catches everything not under /api
    - host: platform.127.0.0.1.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sitepilot-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sitepilot-frontend
                port:
                  number: 80
