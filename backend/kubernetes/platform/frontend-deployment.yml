apiVersion: apps/v1
kind: Deployment
metadata:
  name: sitepilot-frontend
  namespace: sitepilot-platform
  labels:
    app: sitepilot-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sitepilot-frontend
  template:
    metadata:
      labels:
        app: sitepilot-frontend
    spec:
      containers:
        - name: frontend
          image: localhost:5000/sitepilot/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sitepilot-frontend
  namespace: sitepilot-platform
spec:
  selector:
    app: sitepilot-frontend
  ports:
    - port: 80
      targetPort: 80
