apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sitepilot-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape the platform API
      - job_name: sitepilot-api
        static_configs:
          - targets: ['sitepilot-api:8000']

      # Scrape all tenant site pods via K8s service discovery
      - job_name: tenant-sites
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['tenants']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_managed_by]
            action: keep
            regex: sitepilot
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      # Scrape K8s node metrics (requires metrics-server)
      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sitepilot-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sitepilot-platform
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
