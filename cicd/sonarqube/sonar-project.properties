sonar.projectKey=sitepilot-backend
sonar.projectName=SitePilot Backend
sonar.projectVersion=0.1.0

sonar.sources=backend/app
sonar.tests=backend/tests
sonar.language=py
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.11

# Exclusions
sonar.exclusions=**/alembic/**,**/__pycache__/**,**/migrations/**

# Quality Gate thresholds (configured in SonarQube UI, but documented here)
# Coverage:    >= 40%
# Bugs:        0 new critical
# Code smells: < 10 new
